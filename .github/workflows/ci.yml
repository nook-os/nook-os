name: CI

# A merge queue builds the PROSPECTIVE merge commit and reports on
# `merge_group` — a distinct event, not a push and not a pull_request. Without
# it here, an enqueued PR waits on three required contexts that never start and
# the queue ejects it on timeout. So this trigger lands BEFORE the queue is
# switched on (MAIN-540); enabling it is a separate card.
#
# WHICH JOBS ANSWER WHICH EVENT, and why:
#
#   job              push  pull_request  merge_group   why
#   build             y         y             y        the two required legs
#                                                      cannot run without its
#                                                      archive, so it answers
#                                                      every event they do
#   rust (postgres)   y         y             y        required context
#   rust (sqlite)     y         y             y        required context
#   lint              y         y             y        NOT required yet, and
#                                                      has no `if` anyway —
#                                                      MAIN-656 makes it
#                                                      required right after
#                                                      merge, and the rule
#                                                      below is exactly why the
#                                                      `if` must not be there
#                                                      when that happens
#   chart-e2e         y         y             y        required context (see
#                                                      its own note: the queue
#                                                      build takes the fast
#                                                      path)
#   workflows         y         y             .        not required, so its
#   frontend          y         y             .        verdict cannot gate the
#   desktop           y         y             .        queue — running it on a
#   type-gen-drift    y         y             .        queue build burns a
#   helm              y         y             .        runner to produce a
#                                                      result nothing reads.
#                                                      The PR run already gave
#                                                      it, and the `push` run
#                                                      on main gives it again
#                                                      after the merge.
#   operator-node-e2e .         .             .        workflow_dispatch only
#
# MAKING ONE OF THE SKIPPED JOBS REQUIRED MEANS DELETING ITS `if` HERE FIRST. A
# required context that skips on `merge_group` never reports, and a queue waits
# on it forever — the exact failure this card exists to prevent.
#
# There is deliberately NO `concurrency:` block in this workflow, and adding one
# is the other way to break a queue: the obvious group key
# (`${{ github.workflow }}-${{ github.ref }}` with `cancel-in-progress`) lets a
# PR push cancel the queue build for the same branch, which leaves the required
# contexts reporting `cancelled` forever. If a group is ever added it must key
# on `github.event_name` too, so a `merge_group` run and a `pull_request` run
# can never share one.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ONE compile per CI run (MAIN-656). Nothing in this workspace is
  # engine-specific at BUILD time — no crate has a `build.rs`, there are no
  # `sqlx::query!` compile-time macros, and `DATABASE_URL` is read purely at
  # runtime — so the two engine legs below used to build byte-identical test
  # binaries on two different runners, with clippy compiling the workspace a
  # third time in front of one of them. This job builds them once; the legs
  # only run them.
  #
  # It answers every event the legs do, `merge_group` included. A `build` that
  # skipped on a queue build would leave two REQUIRED contexts with nothing to
  # run, which is the failure this workflow's header exists to prevent.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Declared identically on both legs. A binary built here is executed
      # there, so a build input that differed between the two would mean the
      # archive is not the thing under test.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      # LLD (MAIN-578). Linking, not compiling, is what made the old
      # `Test (postgres)` step the entire CI wall clock. The 147 nook-control
      # test binaries it was originally weighed against are one binary since
      # MAIN-657; the workspace still links ~30 more, so it still earns its 5s.
      #
      # Installed and applied in CI ONLY, via RUSTFLAGS rather than a checked-in
      # `.cargo/config.toml`: a config file would demand every developer and
      # every container have lld installed or their build breaks, which is a
      # steep price for a CI problem.
      - name: Fast linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: dtolnay/rust-toolchain@stable
      # PINNED, and pinned to the same version deploy/docker/dev-rust.Dockerfile
      # installs. AC-6's promise is that `./test.sh` gives the verdict CI gives
      # rather than a similar one, and two independently-floating copies of the
      # runner make that a coincidence instead of a fact.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@v2
      # `nook` is the one binary the suite needs that this build does not
      # produce: cargo builds a package's bins for that package's own
      # integration tests, and nook-node has none. `.config/nextest.toml`'s
      # `archive.include` puts it in the archive; this is what makes it exist to
      # include, and `on-missing = "error"` there is what fails the build rather
      # than the leg if this step ever goes away.
      - name: Build the node binary the desktop suite drives
        run: cargo build -p nook-node --bin nook --profile ci
      # `--cargo-profile ci` is the symbol-free build (see Cargo.toml): these
      # binaries have to travel between three jobs, and the `dev` profile's
      # symbols make that 5.2 GB of upload and download to render frames CI has
      # never printed.
      - name: Archive the test binaries
        run: |
          cargo nextest archive --workspace --cargo-profile ci \
            --archive-file nextest-archive.tar.zst
          ls -l nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          # Already zstd. Asking the uploader to compress it again spends
          # minutes to save nothing.
          compression-level: 0
          # An empty upload would turn "the build silently produced nothing"
          # into two legs failing on a missing archive, one job too late.
          if-no-files-found: error
          # Nothing reads it after the run it was built for.
          retention-days: 1

  # Everything engine-independent, off the required legs' critical path
  # (MAIN-656). These steps used to sit on `rust (postgres)` behind
  # `if: matrix.engine == 'postgres'`, so clippy's own full compile ran in
  # front of the Postgres tests — on a required context, for checks that need
  # no database and differ in no way between engines.
  #
  # NO job-level `if:`, deliberately. This becomes a REQUIRED context right
  # after MAIN-656 merges (clippy stops gating the moment it leaves
  # `rust (postgres)`), and per the header above a required job that skips on
  # `merge_group` never reports and the queue waits on it forever. The `if`
  # that looks like an obvious saving here is the thing that would break it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - name: Fast linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # `-D warnings`, matching `./test.sh`'s gate exactly. Without it a
        # warning merged clean and then broke every local run until someone
        # hunted it down — which is how main came to be red on three of them.
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The source guards, and their self-tests. Pure shell + awk over the tree:
      # no Docker, well under a second, and nothing else was running them —
      # `check-sqlx-signatures.sh` had been RED on main unnoticed because it
      # lives only in `./test.sh lint`, where `actionlint` exits first in any
      # environment that cannot pull its image (MAIN-345 AC-5).
      - name: Source guards
        run: |
          ./scripts/check-case-collisions.sh
          ./scripts/check-case-collisions.test.sh
          ./scripts/check-inline-sql.sh
          ./scripts/check-inline-sql.test.sh
          ./scripts/check-sqlx-signatures.sh
          ./scripts/check-sqlx-signatures.test.sh
          # MAIN-354. A cast nested inside a seam call is valid Postgres, so no
          # amount of RUNNING the Postgres suite can see the defect — only
          # reading the source can. Catching it here is a whole engine-run
          # earlier than the SQLite leg, and for a test still on the exclusion
          # list it is the only place it is caught at all.
          ./scripts/check-nested-dialect.sh
          ./scripts/check-nested-dialect.test.sh
          # MAIN-604. Not a source guard but the same shape — a shell script
          # whose self-test needs nothing but bash, and whose subject (the RC
          # workflow's image report) is otherwise exercised only by a release.
          ./scripts/publish-image-report.test.sh
          # MAIN-656. Same shape again, and it earns the line: this card
          # rewrote the guard's whole parser, and that guard is now the SQLite
          # leg's SOLE verdict. Leaving its self-test only in `./test.sh lint`
          # is the exact placement the note above blames for
          # `check-sqlx-signatures.sh` sitting red on main unnoticed.
          ./scripts/check-sqlite-ci.test.sh
          # `check-dialect-dispatch.sh` is deliberately absent, and so is its
          # self-test. Both are RED on main today — an unlisted offender in
          # repo/read_model.rs plus three stale entries — and the self-test's
          # first assertion is "green on the tree as committed", so it fails
          # for the same reason. Nobody noticed for exactly the reason MAIN-345
          # existed: nothing ran them. Adding either would break CI for a
          # defect that is not this card's, so they wait for their own.
      # nextest runs one process per test and never runs doctests — rustdoc
      # compiles and runs those, which is a different tool. They used to ride
      # along inside `cargo test --workspace` on the Postgres leg, so they land
      # here rather than quietly disappearing when that leg stopped compiling.
      # Every fence in this tree is `ignore` or `text` today, so this is a
      # compile of the workspace's libs and zero executed tests; it is here to
      # keep that true.
      - name: Doc tests
        run: cargo test --doc --workspace

  # Two engines, one suite (MAIN-270, epic AC-6). "Works on SQLite" is a claim
  # until CI runs it, so the suite runs twice — Postgres and SQLite — as matrix
  # legs, in parallel: wall-clock is the slower leg, not the sum.
  #
  # POSTGRES IS THE DEFAULT ENGINE and runs the whole suite, exactly as before.
  #
  # THE SQLITE LEG IS REQUIRED, NOT ADVISORY, but it does not yet cover
  # everything: a handful of tests still fail on SQLite, every one owned by an
  # upstream card. Those TESTS are named in scripts/sqlite-ci-allowlist.txt with
  # the card each waits on, and scripts/check-sqlite-ci.sh enforces the boundary
  # in BOTH directions: a covered test that fails reddens the leg, and an
  # EXCLUDED test that starts passing also reddens it, so the list can only
  # shrink. When the last line is deleted the SQLite leg covers the full suite
  # and epic AC-6 is met in full — the list is the remaining work, in order.
  #
  # RUNNING EACH LOCALLY (the dev stack is docker-first — see CLAUDE.md):
  #   Postgres (the default):  ./test.sh rust
  #   SQLite:                  ./test.sh rust --sqlite
  # `./test.sh rust --sqlite` runs the same suite on a SQLite bed and applies
  # this same guard, so it gives the same verdict CI does.
  #
  # NEITHER LEG COMPILES ANYTHING (MAIN-656). Both download `build`'s archive
  # and execute it, and the "Nothing was compiled here" step below fails the leg
  # if a `Compiling` line ever appears — an assertion rather than an intention,
  # because a silent fallback to compiling would restore the cost this change
  # removed without changing a single result.
  rust:
    needs: build
    # `always()`, not the default (MAIN-656 AC-3). These are REQUIRED contexts:
    # if `build` fails, a leg left to inherit `skipped` never reports at all,
    # and a merge queue waits on it until it ejects the PR. So both legs run
    # regardless, find no archive, and fail BY NAME — on `merge_group` exactly
    # as on `pull_request`.
    if: always()
    runs-on: ubuntu-latest
    # 25, not the 20 this had while it compiled. A leg's time is now mostly
    # transfer and unpack, which is bounded by the runner's disk rather than by
    # anything in this repo — and a required context hitting a timeout is a
    # worse outcome than a ceiling nobody reaches.
    timeout-minutes: 25
    strategy:
      # Both legs always report. Cancelling the sibling on first failure would
      # mean a Postgres failure hides whether SQLite also broke, which is the
      # one comparison this matrix exists to provide.
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            database_url: postgres://nook:nook@localhost:5432/nook
          # A file, not :memory: — that is the shape a real single-machine
          # deployment has, and it is what the testkit's SQLite bed models.
          - engine: sqlite
            database_url: sqlite:///tmp/nook-ci.db
    name: rust (${{ matrix.engine }})
    # Without a database the suite reports "ok" while executing almost nothing:
    # every test that needs Postgres returns early. NOOK_REQUIRE_DB turns that
    # silent skip into a failure, so a green tick means the tests actually ran.
    #
    # The services are declared for both legs. Postgres is unused by the SQLite
    # leg (its beds are files), but `services` cannot be varied per matrix entry
    # and a few seconds of container start is not worth a second job definition.
    # Redis and ElasticMQ are wanted by BOTH legs: those contract tests are
    # engine-independent and skip silently without their endpoints.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nook
          POSTGRES_PASSWORD: nook
          POSTGRES_DB: nook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nook"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Redis for the redis queue provider's contract tests (MAIN-150). Without
      # NOOK_TEST_REDIS_URL those tests skip; here they run against a real Redis.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # ElasticMQ — an in-memory SQS for the sqs queue provider's contract tests
      # (MAIN-152). No health-cmd: the native image has no shell tools, so the
      # "Wait for ElasticMQ" step below gates readiness from the runner instead.
      # Without NOOK_TEST_SQS_ENDPOINT those tests skip; here they run for real.
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.11
        ports: ["9324:9324"]
    env:
      # The SAME value `build` declares. Nothing here compiles — the step below
      # fails the leg if anything does — but a build input that differed between
      # the job that produced a binary and the job that runs it would mean the
      # archive was not the thing under test. lld itself is deliberately NOT
      # installed here: with no linking to do it is a minute of apt for nothing,
      # and a fallback compile failing loudly on a missing linker is a better
      # outcome than one succeeding quietly.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # No debug info in CI (MAIN-664). Roughly 45% of a linked test binary is
      # DWARF — measured, `crates/nook-control/tests`' binaries link to 23.4 GB
      # with it and 13.0 GB without — and nothing here ever reads it:
      # `RUST_BACKTRACE` is set nowhere in `.github/`, `scripts/`, `test.sh` or
      # `docker-compose.yml`, so no frame is ever symbolized. Writing those
      # bytes is link time, and linking is what makes this job's build most of
      # its minutes.
      #
      # Failure diagnostics do NOT depend on it: a panic's `file:line` comes
      # from `Location::caller()`, compile-time metadata rather than DWARF (the
      # distinction `crates/nook-errors/src/lib.rs:23` draws), so `assert_eq!`
      # failures and panics keep naming their file and line with this set.
      #
      # It is a CI-only override, deliberately not a `Cargo.toml` change:
      # `[profile.dev] debug = "line-tables-only"` stays the LOCAL default,
      # because the machine you debug on is the one that wants line tables.
      # `[profile.test]` inherits `[profile.dev]`, so test binaries and
      # dependencies are both covered by this one variable.
      #
      # ESCAPE HATCH: when a CI-only flake genuinely needs frames, comment this
      # line out on a scratch branch and push — there is no input or toggle to
      # find, and nothing else has to change.
      CARGO_PROFILE_DEV_DEBUG: "0"
      DATABASE_URL: ${{ matrix.database_url }}
      NOOK_REQUIRE_DB: "1"
      NOOK_TEST_REDIS_URL: redis://localhost:6379
      NOOK_TEST_SQS_ENDPOINT: http://localhost:9324
    steps:
      # The checkout is for scripts/check-sqlite-ci.sh and its lists, not for
      # source: the tests themselves are compiled already.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The version `build` pinned, for the reason stated there.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # `continue-on-error`, so that a `build` that failed reaches the named
      # error below rather than this action's own "artifact not found". Under
      # `if: always()` this leg runs on exactly that path.
      - name: Fetch the test archive
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nextest-archive
      - name: The test archive must be here
        run: |
          if [ ! -f nextest-archive.tar.zst ]; then
            echo "::error::the 'build' job produced no nextest-archive.tar.zst, so this leg has nothing to run. Fix 'build' — this leg reports a failure rather than a skip on purpose, so a required context always reports."
            exit 1
          fi
      - name: Wait for ElasticMQ
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:9324/?Action=ListQueues&Version=2012-11-05" >/dev/null; then
              echo "ElasticMQ ready"; exit 0
            fi
            sleep 1
          done
          echo "ElasticMQ did not become ready" >&2; exit 1
      # `--extract-to .` is NOT cosmetic, and a temporary directory is not an
      # equivalent choice. Several tests reach for a sibling binary through
      # `env!("CARGO_BIN_EXE_nook-control")`, which the compiler bakes in as an
      # ABSOLUTE path — `<workspace>/target/ci/nook-control`. Every job in a
      # workflow checks out at the same path, so extracting here puts those
      # binaries exactly where the build job left them and the constant
      # resolves; extracting anywhere else leaves seven tests pointing at a file
      # that does not exist. `--extract-overwrite` because the checkout is
      # already here.
      #
      # --no-fail-fast: nextest stops at the FIRST failing test by default, where
      # `cargo test` at least finished the binary it was in. A red run should
      # show everything that is red, not the first thing.
      - name: Test (postgres)
        if: matrix.engine == 'postgres'
        run: |
          set -o pipefail
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --workspace-remap . --extract-to . --extract-overwrite \
            --no-fail-fast 2>&1 | tee nextest-run.log
      # nextest's exit code is deliberately ignored here and the verdict
      # delegated to the guard: on SQLite the excluded tests are EXPECTED to
      # fail, so a non-zero run is the normal case and says nothing on its own.
      # The guard answers the two questions that matter — did anything covered
      # break, and has anything excluded started passing.
      #
      # The `sqlite` profile (.config/nextest.toml) is what writes the JUnit
      # report the guard reads, and it is the same profile
      # `./test.sh rust --sqlite` runs — which is what makes the two give one
      # verdict rather than two similar ones.
      - name: Test (sqlite)
        if: matrix.engine == 'sqlite'
        run: |
          set -o pipefail
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --workspace-remap . --extract-to . --extract-overwrite \
            --profile sqlite 2>&1 | tee nextest-run.log || true
          # Located rather than hardcoded: the store directory hangs off
          # whichever target dir nextest used, and running from an archive that
          # is the extracted one — a detail of nextest's, not a promise to us.
          report="$(find . -path '*/nextest/sqlite/junit.xml' -print -quit)"
          if [ -z "$report" ]; then
            echo "::error::the sqlite profile wrote no JUnit report — the run did not get as far as testing"
            exit 1
          fi
          ./scripts/check-sqlite-ci.sh "$report"
      # An ASSERTION, not an intention (MAIN-656). If a leg ever falls back to
      # compiling — a stale flag, an archive that did not match, a future step
      # that reaches for cargo — it silently costs back everything this change
      # saved while every result stays identical, so nothing else would notice.
      # `always()` so a leg that failed its tests still reports this.
      - name: Nothing was compiled here
        if: always()
        run: |
          if [ ! -f nextest-run.log ]; then
            echo "no run log — this leg never got as far as running tests; see the failure above."
            exit 0
          fi
          if sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' nextest-run.log \
             | grep -qE '^[[:space:]]*Compiling '; then
            echo "::error::this leg compiled workspace crates instead of running the build job's archive"
            exit 1
          fi
          echo "no Compiling lines — the archive was executed, not rebuilt"

  # A workflow with a bad expression does not fail a job — it fails to parse,
  # so nothing runs and the error only appears when someone pushes a tag and
  # waits. Exactly that happened with a `secrets` reference in a step-level
  # `if`, which is not a context that exists there. actionlint catches it in
  # seconds.
  workflows:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  frontend:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm -r typecheck
      - name: Test
        working-directory: frontend
        run: pnpm -r test

  # The Tauri shell is deliberately outside the cargo workspace, so `rust`
  # above cannot see it: `--workspace` excludes it and `fmt --all` walks the
  # same members. That gap shipped a desktop app whose device sign-in could
  # never complete, and CI was green throughout. This is the job that would
  # have caught it.
  desktop:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/apps/desktop/src-tauri
      # Tauri links against the system webview; without these the crate does
      # not build at all.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
        working-directory: .
      # `generate_context!` reads tauri.conf.json, whose frontendDist points at
      # the built web app. Nothing here runs the UI, but the directory has to
      # exist or the macro fails the build.
      - name: Stub the frontend bundle
        run: mkdir -p frontend/apps/web/dist && touch frontend/apps/web/dist/index.html
        working-directory: .
      # Same shape, same reason (MAIN-395): `tauri_build::build()` copies every
      # `externalBin` for the host triple and FAILS when one is absent —
      # verified by deleting them, which turns this job red before a single
      # lint runs. This job only type-checks Rust, so empty files are the
      # honest stand-in; the REAL binaries are staged in `release.yml`, from
      # the same build the release already produces.
      - name: Stub the sidecars
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p frontend/apps/desktop/src-tauri/binaries
          for b in nook nook-control; do
            : > "frontend/apps/desktop/src-tauri/binaries/$b-$triple"
            chmod +x "frontend/apps/desktop/src-tauri/binaries/$b-$triple"
          done
        working-directory: .
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  type-gen-drift:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regenerate types
        run: ./scripts/gen-types.sh
      - name: Committed types must match Rust
        run: git diff --exit-code frontend/packages/api/openapi.json frontend/packages/api/src/generated/schema.d.ts

  # The Helm chart must lint and render valid, secret-free manifests. Cheap and
  # fast, so it runs on every PR rather than only when charts/ changes.
  helm:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Lint and render the chart
        run: ./charts/nook-control/ci/validate.sh
      - name: Lint and render the operator-node chart
        run: ./charts/nook-operator-node/ci/validate.sh

  # A real (kind) bring-up of the chart on top of the lint/template job above:
  # install against an in-cluster Postgres, assert both Deployments converge and
  # the app answers, exercise `helm upgrade`, then tear down. It builds the
  # images, so it is far heavier than `helm` — hence path-filtered to the chart,
  # its images, and this workflow (plus workflow_dispatch for on-demand runs).
  #
  # AC-2 (MAIN-38) — this job must be safe to make a REQUIRED status check. A
  # required check that never runs blocks a PR forever, so the job runs
  # UNCONDITIONALLY (no job-level `if`) and gates only its heavy steps: on a PR
  # that touches no chart files every heavy step skips and the job is a fast
  # success (the explicit skip note below), so `chart-e2e` reports green on
  # EVERY PR — chart PRs run the deploy, non-chart PRs are not blocked. The same
  # reasoning is why it has no `merge_group` `if` either (MAIN-540): a queue
  # waits on this context by name.
  chart-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read access to the org's published container images, so the e2e can pull
    # them rather than compile the control plane in-job (a full Rust build on a
    # 2-CPU runner starved the kind node and Postgres never became Ready).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Skipped on a queue build, which leaves `charts` unset so every heavy
      # step below skips too. Two reasons, either sufficient: a `merge_group`
      # event carries no before/base the filter can diff against, so asking it
      # would redden a REQUIRED context on the event this job most has to
      # answer; and a chart PR already ran the full kind deploy on its head, so
      # repeating it would put 30 minutes into every merge for a signal already
      # in hand and repeated by the `push` run on main straight after. The cost,
      # stated plainly so the card that enables the queue chooses it again rather
      # than inherits it: the prospective merge commit is then the one commit
      # whose chart deploy is never exercised.
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name != 'merge_group'
        with:
          filters: |
            charts:
              - 'charts/**'
              - 'deploy/docker/**'
              - 'scripts/k8s-e2e.sh'
              - '.github/workflows/ci.yml'
      - name: Queue build — skip the deploy test
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group build: the kind deploy test ran on the PR head already."
          echo "Skipping it here; this required check reports success."
      # The fast-success path: no chart-affecting files changed, so the deploy
      # test is intentionally skipped and this required check reports green.
      - name: No chart changes — skip the deploy test
        if: github.event_name != 'merge_group' && steps.changes.outputs.charts != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "No changes under charts/, deploy/docker/, scripts/k8s-e2e.sh or the CI workflow."
          echo "Skipping the kind deploy test; this required check reports success."
      - name: Set up Helm
        if: steps.changes.outputs.charts == 'true' || github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      # Install the kind binary only; the e2e script owns the cluster lifecycle
      # (create, assert, delete) so it can be idempotent and self-cleaning.
      - name: Set up kind
        if: steps.changes.outputs.charts == 'true' || github.event_name == 'workflow_dispatch'
        uses: helm/kind-action@v1
        with:
          install_only: true
      # Pull the published images (private packages need this login; public ones
      # ignore it). The e2e retags them as its two upgrade tags — no in-job compile.
      - name: Log in to ghcr
        if: steps.changes.outputs.charts == 'true' || github.event_name == 'workflow_dispatch'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Chart end-to-end on kind
        if: steps.changes.outputs.charts == 'true' || github.event_name == 'workflow_dispatch'
        run: ./scripts/k8s-e2e.sh --pull

  # Shared operator node bring-up over docker-compose (MAIN-125): build the
  # operator image, join the control plane, assert it comes online with the
  # shared-operator designation, and survives a restart with its identity intact.
  #
  # workflow_dispatch ONLY — never on a PR push. The build pulls the agent
  # runtimes (claude/codex/copilot from npm, hermes from its install script) over
  # the network, so its availability must not gate merges. Run it on demand from
  # the Actions tab when the image or its wiring changes.
  operator-node-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Operator node bring-up on docker-compose
        run: ./scripts/operator-node-e2e.sh
