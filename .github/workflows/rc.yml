name: RC images

# Deploy tooling finds the run it just dispatched by matching this title
# exactly — "rc <full sha>". A run's headSha is the branch the workflow was
# dispatched on, NOT the commit being built, so the title is the only reliable
# handle when those two differ. Change the shape here, change it there.
run-name: rc ${{ inputs.ref }}

# Deploying a commit without cutting a release.
#
# `release.yml` is the promise: a tag, a version guard, binaries, a desktop
# bundle, a chart, a GitHub release. All of that is what makes a release worth
# trusting, and all of it is ceremony when the only question is "does this
# commit work on a real deployment?".
#
# This publishes exactly the container images the prod compose file pulls,
# tagged `rc-<short sha>`, and nothing else. No git tag, no version bump, no
# release, no chart. It shares `release.yml`'s build cache scopes on purpose, so
# an RC is usually a few minutes and it warms the cache the real release will
# use.
#
# NOT wired to `push`: six images across two architectures is twelve runners,
# which is the right cost when you ask for it and the wrong one on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to build
        required: true
      images:
        description: Comma-separated subset to build; the rest are aliased from `base`
        required: false
        default: control,node,operator-node,web,chat,worker
      base:
        description: "Tag the un-built images are aliased from (default: newest release)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------- plan
  #
  # Resolve the ref, name the tag, and split the image set into "build these"
  # and "alias the rest". The split is what makes a partial build safe: the
  # compose file pins ONE tag for every service, so an RC that published only
  # `control` would leave `web`, `chat`, `worker` and `operator-node`
  # unpullable at that tag. Aliasing points those at the newest release's
  # manifest instead, so `rc-<sha>` is always a complete set.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      built: ${{ steps.plan.outputs.built }}
      rest: ${{ steps.plan.outputs.rest }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          IMAGES: ${{ inputs.images }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail

          # Resolving through the API instead of a checkout is also the check
          # that matters: only a commit GitHub already has can be built, so an
          # unpushed one fails here, with one clear message, before twelve
          # runners start.
          sha="$(gh api "repos/${REPO}/commits/${REF}" -q .sha)"
          [ -n "$sha" ] || { echo "::error::no such commit on GitHub: ${REF}"; exit 1; }
          tag="rc-${sha:0:8}"

          all='[
            {"image":"control","dockerfile":"deploy/docker/control.Dockerfile"},
            {"image":"node","dockerfile":"deploy/docker/node.Dockerfile"},
            {"image":"operator-node","dockerfile":"deploy/docker/operator-node.Dockerfile"},
            {"image":"web","dockerfile":"deploy/docker/web-prod.Dockerfile"},
            {"image":"chat","dockerfile":"deploy/docker/chat.Dockerfile"},
            {"image":"worker","dockerfile":"deploy/docker/worker.Dockerfile"}
          ]'

          # `sed` and not `tr -d`: tr has no concept of lines, so deleting
          # whitespace with it deletes the newlines this just split on and the
          # whole list collapses into one token named "controlnodeweb…".
          built="$(printf '%s' "$IMAGES" | tr ',' '\n' | sed 's/[[:space:]]//g' \
                   | grep -v '^$' | jq -Rc . | jq -sc .)"

          unknown="$(jq -rn --argjson all "$all" --argjson built "$built" \
            '[$built[] | select(. as $i | ($all | map(.image)) | index($i) | not)] | join(", ")')"
          [ -z "$unknown" ] || { echo "::error::unknown image(s): ${unknown}"; exit 1; }
          [ "$(jq 'length' <<<"$built")" -gt 0 ] || { echo "::error::no images selected"; exit 1; }

          # One row per image × arch, built here rather than as a matrix
          # `include:` — an include entry naming an image the dynamic axis does
          # not contain becomes its OWN combination (with no arch), which is a
          # job that cannot run.
          matrix="$(jq -cn --argjson all "$all" --argjson built "$built" '
            {include: [
              $all[]
              | select(.image as $i | $built | index($i)) as $e
              | ({"amd64":"ubuntu-22.04","arm64":"ubuntu-22.04-arm"} | to_entries[]) as $a
              | {image: $e.image, dockerfile: $e.dockerfile, arch: $a.key, runner: $a.value}
            ]}')"

          rest="$(jq -cn --argjson all "$all" --argjson built "$built" \
            '[$all[].image | select(. as $i | $built | index($i) | not)]')"

          if [ "$rest" != "[]" ] && [ -z "$BASE" ]; then
            BASE="$(gh release view --repo "${REPO}" --json tagName -q .tagName)"
            [ -n "$BASE" ] || { echo "::error::no release to alias the un-built images from"; exit 1; }
          fi

          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "matrix=$matrix"
            echo "built=$built"
            echo "rest=$rest"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### RC \`${tag}\`"
            echo
            echo "- commit: \`${sha}\`"
            echo "- building: \`$(jq -r 'join(", ")' <<<"$built")\`"
            [ "$rest" = "[]" ] || echo "- aliased from \`${BASE}\`: \`$(jq -r 'join(", ")' <<<"$rest")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- images
  #
  # Native runner per architecture, pushed by digest, stitched into one
  # multi-arch tag below — the same shape as `release.yml`, for the same reason
  # (buildx + QEMU emulates the whole Rust compile).
  images:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/nook-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Deliberately the SAME scope release.yml uses: an RC of a commit that
          # is about to be tagged should not build everything twice.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: manifest ${{ matrix.image }}
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.built) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest
        working-directory: /tmp/digests
        env:
          REPO: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nook-${{ matrix.image }}
          TAG: ${{ needs.plan.outputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          # ONE tag, and never `latest`: an RC is a specific commit somebody is
          # testing, not a thing anything else should float onto.
          #
          # Word splitting is the point — every digest has to arrive as its own
          # argument, and the filenames are hex, so there is nothing to split on
          # but the spaces we put there.
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$REPO:$TAG" \
            $(printf "${REPO}@sha256:%s " $(ls))
          # Redirected and then printed, rather than piped through `tee`: the
          # default shell has no `pipefail`, so a pipe would make a failed
          # inspect the tee's success and this step would stop noticing that the
          # manifest it just created cannot be read back.
          docker buildx imagetools inspect "$REPO:$TAG" > /tmp/inspect.txt
          cat /tmp/inspect.txt
          # The manifest LIST's digest — what a `docker pull` of this tag
          # resolves to, and the one identifier that outlives the tag. Recorded
          # here, where it is already on screen, so `report` below needs neither
          # a registry login nor a second inspect (MAIN-604).
          mkdir -p /tmp/manifest
          printf '%s\t%s\t%s\n' "$REPO" "$TAG" \
            "$(awk '/^Digest:/ { print $2; exit }' /tmp/inspect.txt)" \
            > "/tmp/manifest/${IMAGE}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.image }}
          path: /tmp/manifest/*
          retention-days: 1

  # ----------------------------------------------------------------- report
  #
  # Say on the board what this build produced (MAIN-604). The images are already
  # published by the time this runs; this is only the sentence about them —
  # written to the card the built commit's pull request closes, keyed `images`,
  # so building that pull request again replaces the table instead of adding a
  # second one.
  #
  # ONE job rather than a step in `merge`: the report is a single table covering
  # every image, and per-image it would be six producers writing one key.
  #
  # `alias` is deliberately not in `needs`. An aliased image is an earlier
  # release's manifest under a new tag, and this build did not produce it — the
  # table says what was BUILT.
  #
  # Nothing here can redden the run. The publisher treats every reason it cannot
  # deliver — no pull request, no `Closes` line, an unreachable control plane, a
  # revoked token — as a line in the log, because a remark about a build is not
  # a reason to throw the images away. `scripts/publish-image-report.test.sh`
  # holds that to it.
  report:
    name: report to the board
    needs: [plan, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Which pull request the built commit belongs to. Read-only, and the only
      # thing this job asks GitHub for.
      pull-requests: read
    steps:
      # The workflow's own ref, NOT the commit being built: this job and the
      # script it runs are one pair, and an RC of an older commit predates both.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: /tmp/manifest
          merge-multiple: true
      - name: Publish the image report
        env:
          # Both unset is the ordinary state of a fork, and of this repository
          # before the credential is minted: the publisher says so and stops.
          # The token is scoped `reports:write` and narrowed to this workspace —
          # see docs/ci-deploy.md.
          NOOK_URL: ${{ vars.NOOK_URL }}
          NOOK_TOKEN: ${{ secrets.NOOK_REPORTS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: cat /tmp/manifest/*.tsv | sort | ./scripts/publish-image-report.sh "$SHA"

  # ------------------------------------------------------------------ alias
  #
  # Point every image this RC did NOT build at the base release's manifest, so
  # `rc-<sha>` names a complete set and the compose pin stays whole. Copies a
  # manifest; builds nothing.
  alias:
    name: alias ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.rest != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.rest) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REPO: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nook-${{ matrix.image }}
          TAG: ${{ needs.plan.outputs.tag }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          docker buildx imagetools create -t "$REPO:$TAG" "$REPO:$BASE"
          docker buildx imagetools inspect "$REPO:$TAG"
