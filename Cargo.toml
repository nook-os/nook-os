[workspace]
resolver = "2"
members = [
    "crates/nook-types",
    "crates/nook-db",
    "crates/nook-db-derive",
    "crates/nook-desktop-env",
    "crates/nook-proto",
    "crates/nook-auth",
    "crates/nook-chat",
    "crates/nook-infra",
    "crates/nook-k8s",
    "crates/nook-control",
    "crates/nook-dispatcher",
    "crates/nook-mcp",
    "crates/nook-node",
    "crates/nook-openapi-gen",
    "crates/nook-worker",
    "crates/nook-testkit",
    "crates/nook-errors",
]

[workspace.package]
version = "0.6.15"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nookos/nookos"

[workspace.dependencies]
nook-errors = { path = "crates/nook-errors" }
nook-types = { path = "crates/nook-types" }
nook-db = { path = "crates/nook-db" }
nook-db-derive = { path = "crates/nook-db-derive" }
nook-desktop-env = { path = "crates/nook-desktop-env" }
nook-proto = { path = "crates/nook-proto" }
nook-auth = { path = "crates/nook-auth" }
nook-infra = { path = "crates/nook-infra" }
nook-k8s = { path = "crates/nook-k8s" }
nook-dispatcher = { path = "crates/nook-dispatcher" }
nook-mcp = { path = "crates/nook-mcp" }
nook-control = { path = "crates/nook-control" }
nook-testkit = { path = "crates/nook-testkit" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
form_urlencoded = "1"
url = "2"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
openidconnect = "4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Artifact storage. The S3 SDK also speaks MinIO and Google Cloud Storage's
# S3-compatible endpoint, so one client covers every backend we ship.
aws-config = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = "1"
aws-smithy-types = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
# The tenant export archive (MAIN-659). `tar` for the member headers — the
# checksum and the ustar layout are the part worth not hand-rolling — and
# `flate2` for the gzip stream, which the lockfile already resolved
# transitively.
tar = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
sysinfo = "0.33"
base64 = "0.22"
sha2 = "0.10"
# Password hashing for local accounts. Argon2id is the current recommendation
# for interactive logins: memory-hard, so a stolen database does not turn into
# a GPU cracking exercise the way bcrypt-at-low-cost does.
argon2 = "0.5"
password-hash = "0.5"
# X.509 for the per-tenant CA: generate a CA and sign node CSRs. In-process and
# typed rather than shelling out to openssl, so certificate handling is testable
# and a missing binary can't become a runtime surprise on someone's machine.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# Parse and verify presented client certificates. The "verify" feature is the
# point: a certificate is only an identity if its signature actually chains to
# a CA we trust.
x509-parser = { version = "0.16", features = ["verify"] }
# Pinning the server certificate on first contact needs a custom verifier, so
# the node talks to rustls directly rather than only through a wrapper.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
# The agent listener drives hyper directly: a WebSocket upgrade needs
# serve_connection_with_upgrades, and axum::serve does not expose that once we
# wrap the accepted stream in TLS ourselves.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.9"
dotenvy = "0.15"
# RFC 5322 / MIME parsing for the IMAP source (MAIN-333). A polled mailbox
# hands over whole messages, where the inbound-parse webhook handed over a JSON
# envelope somebody else had already decoded — so this is the one thing the
# second source needs that the first did not.
mail-parser = "0.11"
toml = "0.8"
walkdir = "2"
# Test-only so far: the installer asserts its generated Traefik rule against a
# real engine rather than a second reading of the same pattern (MAIN-511).
regex = "1"
cookie = { version = "0.18", features = ["key-expansion"] }
# Outbound SMTP. rustls, not native-tls, to match the rest of the tree (no
# OpenSSL). Async through tokio; builder for composing the message; no pooling
# (a send is best-effort and one-shot).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }

# MIME for the INBOUND direction (MAIN-334): the direct SMTP receiver is handed
# a whole RFC 5322 message and must find its text, its HTML and its attachments
# — nested multiparts, transfer encodings and RFC 2047 encoded words included.
# lettre is the wrong half of that (it builds messages, it does not parse them),
# and a hand-rolled parser here would be a security-relevant guess.
mailparse = "0.16"

# A build worktree's `target/` reached 120 GB, 96% of it debuginfo inside test
# binaries: each of the 119 integration tests links its own full-DWARF copy of
# the same dependency debuginfo (MAIN-492). `line-tables-only` keeps the
# file:line a failing test's backtrace prints and drops the type and variable
# information nothing in this tree reads; `unpacked` leaves that DWARF in the
# per-unit files the compiler already wrote instead of copying it into all 119
# executables. Test and bench inherit dev, which is where the size is.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# What CI builds its one archive with (MAIN-656). The test binaries are now
# built in one job and EXECUTED in two others, which means they travel as a
# workflow artifact — and 202 binaries each statically linking the whole crate
# graph made that artifact 5.2 GB. Moving 5.2 GB three times costs more than the
# duplicate compile this change removed, so the copy that travels carries no
# symbols: measured 230 MB → 92 MB per binary, and the linker writes 18 GB
# instead of 46 GB on the way there.
#
# It costs nothing that CI prints today. A panic's message and `file:line` come
# from data the compiler embeds, not from the symbol table, and CI has never set
# RUST_BACKTRACE — so the frames this drops were never rendered. `./test.sh`
# and every local run are untouched: they keep `dev`, symbols and all.
[profile.ci]
inherits = "dev"
debug = 0
strip = "symbols"

[profile.release]
lto = "thin"
