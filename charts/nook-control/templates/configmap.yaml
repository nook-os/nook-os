{{- $c := .Values.config -}}
{{- if and $c.authDevMode (eq $c.appEnv "production") -}}
{{- fail "config.authDevMode=true is incompatible with config.appEnv=production: the dev-login hatch must be OFF in production. The control plane (config.rs) refuses to boot on this combo, so the chart refuses to render it. Set config.authDevMode=false, or use a non-production appEnv." -}}
{{- end -}}
{{- $exposure := trim (include "nook-control.devLoginExposure" .) -}}
{{- if $exposure }}
{{ repeat 76 "#" }}
{{ regexReplaceAll "(?m)^" $exposure "# " }}
{{ repeat 76 "#" }}
{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nook-control.fullname" . }}-config
  labels:
    {{- include "nook-control.labels" . | nindent 4 }}
  {{- if $exposure }}
  annotations:
    # An annotation as well as the banner above: a comment is lost the moment
    # this is applied, and `kubectl get cm -o yaml` is where somebody auditing a
    # cluster they did not install looks (MAIN-671).
    nook.dev/insecure-dev-login: |-
      {{- $exposure | nindent 6 }}
  {{- end }}
data:
  # Non-secret control-plane configuration. Secrets are wired separately from
  # existingSecret via secretKeyRef — never here.
  APP_ENV: {{ $c.appEnv | quote }}
  CONTROL_PLANE_BIND: "0.0.0.0:8080"
  NOOK_AGENT_BIND: "0.0.0.0:8081"
  {{- if $c.authDevMode }}
  AUTH_DEV_MODE: {{ $c.authDevMode | quote }}
  {{- end }}
  {{- with $c.logLevel }}
  RUST_LOG: {{ . | quote }}
  {{- end }}
  {{- with $c.publicBaseUrl }}
  PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $c.webOrigin }}
  WEB_ORIGIN: {{ . | quote }}
  {{- end }}
  {{- with include "nook-control.tunnelHost" . }}
  # The tunnel zone, from ingress.tunnelHost — the SAME value the Ingress builds
  # its `*.<zone>` rule from, so the router and the surface it routes to cannot
  # disagree about which hosts are tunnels'. Unset, the surface stays off and
  # `nook tunnel` refuses by name rather than handing back a dead URL.
  TUNNEL_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with $c.oidc.issuerUrl }}
  OIDC_ISSUER_URL: {{ . | quote }}
  {{- end }}
  {{- with $c.oidc.clientId }}
  OIDC_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with $c.oidc.redirectUrl }}
  OIDC_REDIRECT_URL: {{ . | quote }}
  {{- end }}
  {{- with $c.oidc.scopes }}
  OIDC_SCOPES: {{ . | quote }}
  {{- end }}
  {{- with $c.oidc.deviceClientId }}
  OIDC_DEVICE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  # Sessionless runtime authorization (MAIN-282). Without these the control
  # plane has no device flow for that runtime and `POST /runtime-auth` refuses,
  # which on a Pod executor leaves NO working way to authorize an agent — a
  # login session there signs in a container that runs no jobs (MAIN-650).
  #
  # The endpoints and client id are the PROVIDER's. Nothing in this repo can
  # supply them and none are guessed here: an install that does not set them
  # gets the session flow, exactly as before.
  {{- range $runtime, $cfg := $c.runtimeAuth }}
  {{- with $cfg.deviceAuthEndpoint }}
  NOOK_{{ upper $runtime }}_DEVICE_AUTH_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $cfg.tokenEndpoint }}
  NOOK_{{ upper $runtime }}_TOKEN_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $cfg.clientId }}
  NOOK_{{ upper $runtime }}_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scopes }}
  NOOK_{{ upper $runtime }}_SCOPES: {{ . | quote }}
  {{- end }}
  {{- end }}
  # Queue provider (MAIN-153): read by the control plane and the worker alike.
  NOOK_QUEUE_PROVIDER: {{ .Values.queue.provider | quote }}
  {{- if eq .Values.queue.provider "sqs" }}
  {{- with .Values.queue.sqs.queueUrl }}
  NOOK_SQS_QUEUE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.queue.sqs.region }}
  NOOK_SQS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  NOOK_ARTIFACT_STORE: {{ $c.artifactStore | quote }}
  # Set explicitly, always: the built-in default is a per-USER data directory,
  # and the pod's uid 10001 has no business writing its home for this (MAIN-598).
  NOOK_USER_CONTENT_DIR: {{ $c.userContentDir | quote }}
  {{- with $c.s3.bucket }}
  NOOK_S3_BUCKET: {{ . | quote }}
  {{- end }}
  {{- with $c.s3.endpoint }}
  NOOK_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $c.s3.region }}
  NOOK_S3_REGION: {{ . | quote }}
  {{- end }}
  NOOK_S3_PATH_STYLE: {{ $c.s3.pathStyle | quote }}
  {{- with $c.mail.provider }}
  MAIL_PROVIDER: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.from }}
  MAIL_FROM: {{ . | quote }}
  {{- end }}
  {{- if $c.mail.sendEnabled }}
  MAIL_SEND_ENABLED: {{ $c.mail.sendEnabled | quote }}
  {{- end }}
  {{- if $c.mail.notificationsEnabled }}
  MAIL_NOTIFICATIONS_ENABLED: {{ $c.mail.notificationsEnabled | quote }}
  {{- end }}
  {{- with $c.mail.maxPerMonth }}
  MAIL_MAX_PER_MONTH: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.maxPerDay }}
  MAIL_MAX_PER_DAY: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.smtpPort }}
  SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.smtpTls }}
  SMTP_TLS: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.smtpUsername }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with $c.mail.postmarkApiUrl }}
  POSTMARK_API_URL: {{ . | quote }}
  {{- end }}
