{{- include "nook-control.requireSecret" . -}}
{{- $sk := .Values.secretKeys -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nook-control.componentName" (dict "root" . "component" "control") }}
  labels:
    {{- include "nook-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  {{- if include "nook-control.userContentIsExclusive" . }}
  # Stop the old pod BEFORE starting the new one: the upload volume attaches to
  # one node at a time, so an overlapping rollout deadlocks on it (MAIN-653).
  # The trade is a few seconds with no control plane per upgrade, against an
  # upgrade that never finishes without a human holding kubectl.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nook-control.componentSelectorLabels" (dict "root" . "component" "control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nook-control.componentSelectorLabels" (dict "root" . "component" "control") | nindent 8 }}
      annotations:
        # Roll the pods when the non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nook-control.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give in-flight requests time to drain on SIGTERM (matches the control
      # plane's own graceful-shutdown grace period).
      terminationGracePeriodSeconds: 30
      containers:
        - name: control-plane
          image: {{ include "nook-control.controlImage" . }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: agent
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nook-control.fullname" . }}-config
          env:
            # Required secrets, by reference — never rendered into a manifest.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.databaseUrl }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.sessionSecret }}
            {{- if $sk.secretsKey }}
            - name: SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.secretsKey }}
            {{- end }}
            {{- if $sk.oidcClientSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.oidcClientSecret }}
            {{- end }}
            {{- if $sk.ghToken }}
            # The FLEET's GitHub credential (MAIN-407), here so the control
            # plane can ask a repo how many PRs are open and size its review
            # loops to the answer (MAIN-448). `optional: true` for the reason
            # the operator node's chart gives: a Secret without the key must
            # still start the pod. No token is a supported state — review loops
            # simply run at their declared ceiling.
            - name: NOOK_GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.ghToken }}
                  optional: true
            {{- end }}
            {{- if $sk.s3AccessKeyId }}
            - name: NOOK_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.s3AccessKeyId }}
            {{- end }}
            {{- if $sk.s3SecretAccessKey }}
            - name: NOOK_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.s3SecretAccessKey }}
            {{- end }}
            {{- if $sk.smtpPassword }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.smtpPassword }}
            {{- end }}
            {{- if $sk.postmarkToken }}
            - name: POSTMARK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.postmarkToken }}
            {{- end }}
            {{- if $sk.giphyKey }}
            # Chat's GIF picker (MAIN-171). In the Secret rather than the
            # ConfigMap because it is the operator's own API key — even though
            # the control plane then hands it to signed-in browsers, which is
            # how Giphy's web keys are meant to be used. `optional: true` like
            # the GitHub token above: a Secret without the key must still start
            # the pod, since no key is a supported state (chat drops the GIF
            # button and nothing else changes).
            - name: NOOK_GIPHY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ $sk.giphyKey }}
                  optional: true
            {{- end }}
            {{- if .Values.agent.enabled }}
            # Agent mTLS listener: the process reads the cert/key from the paths
            # the tlsSecret is mounted at (below), and advertises publicUrl in
            # join tokens so a node dials the right place.
            - name: NOOK_AGENT_TLS_CERT
              value: {{ include "nook-control.agentCertPath" . | quote }}
            - name: NOOK_AGENT_TLS_KEY
              value: {{ include "nook-control.agentKeyPath" . | quote }}
            - name: NOOK_AGENT_PUBLIC_URL
              value: {{ .Values.agent.publicUrl | quote }}
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness: process is up (DB-free). A DB blip must not restart the pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: DB reachable (SELECT 1). Fails → pulled from endpoints, not restarted.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: migrations run at boot; give them room before liveness bites.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            # Uploads (MAIN-598). Always mounted, because the control plane
            # writes here whenever the store is disk-backed and the image's own
            # filesystem is not somewhere it may write.
            - name: user-content
              mountPath: {{ .Values.config.userContentDir }}
            {{- if .Values.agent.enabled }}
            - name: agent-tls
              mountPath: {{ include "nook-control.agentCertDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: user-content
          {{- if .Values.userContent.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.userContent.persistence.existingClaim | default (include "nook-control.componentName" (dict "root" . "component" "user-content")) }}
          {{- else }}
          # Documented ephemeral case: uploads live only as long as this pod.
          emptyDir: {}
          {{- end }}
        {{- if .Values.agent.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ .Values.agent.tlsSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
