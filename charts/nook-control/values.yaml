# Default values for nook-control.
# The control plane and the nginx web front-end as Deployments, an HTTP Ingress
# fronting web, external Postgres, and secrets by reference. No bundled deps.

# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full resource name (otherwise <release>-<chart>).
fullnameOverride: ""

# -- Image pull secrets for private registries (list of {name}).
imagePullSecrets: []

# ── Control plane ────────────────────────────────────────────────────────────
controlPlane:
  image:
    # -- Container registry for the control-plane image.
    registry: ghcr.io
    # -- Control-plane image repository.
    repository: nook-os/nook-control
    # -- Image tag. Empty ("") defaults to the chart's appVersion.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Number of control-plane replicas. Migrations are advisory-locked, so >1 is safe.
  replicas: 1
  # -- Resource requests/limits for the control-plane container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Extra environment (list of {name,value}) merged into the control-plane container.
  extraEnv: []

# ── Web front-end (nginx: SPA + /api proxy) ──────────────────────────────────
web:
  image:
    # -- Container registry for the web image.
    registry: ghcr.io
    # -- Web image repository (nginx serving the SPA and proxying /api).
    repository: nook-os/nook-web
    # -- Image tag. Empty ("") defaults to the chart's appVersion.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Number of web replicas.
  replicas: 1
  # -- Resource requests/limits for the web container.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # -- Extra environment (list of {name,value}) merged into the web container.
  extraEnv: []
  # -- Pod securityContext for web. nginx runs as its own unprivileged user (101);
  #    the chart mounts emptyDir volumes over nginx's writable paths so the root
  #    filesystem can stay read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # -- Container securityContext for web. nginx listens on 8080 (MAIN-650), so
  #    it needs no capability at all — everything is dropped.
  #
  #    This used to add NET_BIND_SERVICE and claim it let a non-root nginx bind
  #    80. It does not: Kubernetes `capabilities.add` fills the bounding and
  #    permitted sets, and an unprivileged process needs the capability AMBIENT,
  #    which Kubernetes does not support. The pod crash-looped on
  #    `bind() to 0.0.0.0:80 failed (13: Permission denied)` on every cluster.
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ── Queue worker (drains the durable work queue, MAIN-153) ───────────────────
worker:
  # -- Deploy the worker. Off leaves the chart exactly as it was (additive).
  enabled: false
  image:
    # -- Container registry for the worker image.
    registry: ghcr.io
    # -- Worker image repository.
    repository: nook-os/nook-worker
    # -- Image tag. Empty ("") defaults to the chart's appVersion.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Static replica count. Ignored when autoscaling.keda.enabled (KEDA owns it).
  replicas: 1
  # -- NOOK_WORK_TYPES allow-list (comma-separated). Empty = every handler's type.
  workTypes: ""
  # -- Resource requests/limits for the worker container.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # -- Extra environment (list of {name,value}) merged into the worker container.
  extraEnv: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ── Queue provider (MAIN-153) ────────────────────────────────────────────────
# The implementation the control plane AND the worker drain. `database` is the
# zero-infra default (drains the Postgres `work_queue`); `redis` and `sqs` are
# reserved names the chart renders ahead of the binary — the worker refuses them
# at boot until those providers ship (matches the reserved-name design), but the
# manifests and KEDA triggers are ready.
queue:
  # -- NOOK_QUEUE_PROVIDER: "database" | "redis" | "sqs".
  provider: database
  redis:
    # -- The Redis list KEDA watches (redis provider). REDIS URL comes from the
    #    Secret via secretKeys.redisUrl.
    listName: "nook:work_queue"
  sqs:
    # -- NOOK_SQS_QUEUE_URL (sqs provider).
    queueUrl: ""
    # -- NOOK_SQS_REGION.
    region: ""
    # -- Credentials: "irsa" (pod IAM role, no secret) | "secret" (AWS keys from
    #    the Secret via secretKeys.awsAccessKeyId / awsSecretAccessKey).
    credentialsMode: irsa

# ── Worker autoscaling via KEDA (optional, MAIN-153) ─────────────────────────
# KEDA must be installed in the cluster first — the chart does NOT install it
# (NG-1). When disabled (default) the worker uses worker.replicas.
autoscaling:
  keda:
    # -- Render a KEDA ScaledObject to scale the worker on queue depth.
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    # -- How often KEDA polls the trigger, in seconds.
    pollingInterval: 30
    # -- How long to wait before scaling back to minReplicas, in seconds.
    cooldownPeriod: 300
    # -- The ready-depth each replica should keep up with. KEDA scales so
    #    (queue depth / target) ≈ replica count, bounded by min/max.
    targetQueueLength: "20"
    # -- Name of a Secret holding the trigger's connection string, wired via a
    #    KEDA TriggerAuthentication. For `database` its key is the Postgres
    #    connection URL; for `redis` the Redis address. Defaults to existingSecret.
    triggerAuthSecret: ""

# ── Secrets (BY REFERENCE — the chart creates no Secret) ─────────────────────
# Name of a pre-existing Kubernetes Secret holding the values below. REQUIRED.
# The chart wires env vars from it with secretKeyRef and never stores secret
# material in rendered manifests.
existingSecret: ""
# Which keys inside existingSecret map to which env vars. DATABASE_URL and
# SESSION_SECRET are always wired. For the optional ones, set the value to the
# key name inside the Secret to wire it, or leave "" to omit that env var.
secretKeys:
  # -- Secret key holding the external Postgres URL (required). Env: DATABASE_URL.
  databaseUrl: DATABASE_URL
  # -- Secret key holding the 32+ char session secret (required). Env: SESSION_SECRET.
  sessionSecret: SESSION_SECRET
  # -- Secret key holding the vault key (64 hex chars). Env: SECRETS_KEY. "" to omit.
  secretsKey: ""
  # -- Secret key holding the OIDC client secret. Env: OIDC_CLIENT_SECRET. "" to
  #    omit — and omitting is right for a registered or otherwise public client,
  #    which PKCE authenticates instead of a secret (MAIN-651).
  oidcClientSecret: ""
  # -- Secret key holding the FLEET's GitHub token (MAIN-407), read by the
  #    control plane to size review loops to a repo's open PRs (MAIN-448).
  #    Env: NOOK_GH_TOKEN. "" to omit — review loops then run at their declared
  #    ceiling, which is the pre-MAIN-448 behaviour and a supported state.
  #    The same credential the operator node's chart mounts under this name.
  ghToken: ""
  # -- Secret key holding the S3 access key id. Env: NOOK_S3_ACCESS_KEY_ID. "" to omit.
  s3AccessKeyId: ""
  # -- Secret key holding the S3 secret access key. Env: NOOK_S3_SECRET_ACCESS_KEY. "" to omit.
  s3SecretAccessKey: ""
  # -- Secret key holding the SMTP password. Env: SMTP_PASSWORD. "" to omit.
  smtpPassword: ""
  # -- Secret key holding the Postmark server token. Env: POSTMARK_TOKEN. "" to omit.
  postmarkToken: ""
  # -- Secret key holding the operator's Giphy API key (MAIN-171). Env:
  #    NOOK_GIPHY_KEY. "" to omit — chat then has no GIF button, which is the
  #    shipped state and a fully supported one. No key ships with this chart.
  giphyKey: ""
  # -- Secret key holding the Redis URL (queue.provider=redis). Env: NOOK_REDIS_URL. "" to omit.
  redisUrl: ""
  # -- Secret key holding the AWS access key id (queue.provider=sqs, credentialsMode=secret).
  #    Env: AWS_ACCESS_KEY_ID. "" to omit (e.g. IRSA).
  awsAccessKeyId: ""
  # -- Secret key holding the AWS secret access key (sqs + credentialsMode=secret).
  #    Env: AWS_SECRET_ACCESS_KEY. "" to omit.
  awsSecretAccessKey: ""

# ── Non-secret config (rendered into a ConfigMap) ────────────────────────────
config:
  # -- APP_ENV. Use "production" in real deployments (disables the dev-login hatch).
  appEnv: production
  # -- AUTH_DEV_MODE: the dev-login hatch. false (default) is omitted from the
  #    manifest — the control plane defaults to off. Rendering `true` with
  #    appEnv=production FAILS to render, mirroring config.rs which refuses to
  #    boot on that combo. Only ever true for a non-production install.
  #
  #    true opens POST /api/v1/auth/dev-login, which signs ANY caller in as ANY
  #    email and creates the user when the email is unknown; the first user on a
  #    fresh deployment is granted operator. With ingress.enabled it renders a
  #    loud warning and annotates the ConfigMap (MAIN-671) — never set it on an
  #    install the internet can reach. See README, "The dev-login hatch".
  authDevMode: false
  # -- RUST_LOG: a bare level ("info", "debug", "warn") or a full EnvFilter
  #    directive ("nook_control=debug,info"). Empty (default) omits the key, so
  #    the control plane keeps its own "info" default.
  logLevel: ""
  # -- PUBLIC_BASE_URL: the external URL a person reaches the UI at (usually https://<ingress.host>).
  publicBaseUrl: ""
  # -- WEB_ORIGIN: allowed browser origin (usually the same as publicBaseUrl).
  webOrigin: ""
  oidc:
    # -- OIDC_ISSUER_URL of your identity provider.
    issuerUrl: ""
    # -- OIDC_CLIENT_ID. OPTIONAL: leave it empty and the control plane
    #    registers a public client for itself at the IdP (RFC 7591) and
    #    remembers it, so an issuer and a redirect are a complete configuration
    #    (MAIN-651). Set it to use a client you created yourself — doing so wins
    #    outright and no registration is attempted. An IdP that offers neither a
    #    registration_endpoint nor public clients needs this set, and says so in
    #    the log.
    clientId: ""
    # -- OIDC_REDIRECT_URL (usually <publicBaseUrl>/api/v1/auth/callback).
    redirectUrl: ""
    # -- OIDC_SCOPES requested at login.
    scopes: "openid profile email"
    # -- OIDC_DEVICE_CLIENT_ID (the public client for native/device sign-in).
    deviceClientId: ""

  # -- Sessionless runtime authorization, per runtime (MAIN-282, MAIN-650).
  #    Keyed by runtime name (`claude`, `codex`); the keys become
  #    NOOK_<RUNTIME>_DEVICE_AUTH_ENDPOINT / _TOKEN_ENDPOINT / _CLIENT_ID /
  #    _SCOPES.
  #
  #    Required to authorize an agent on a KUBERNETES executor: a login session
  #    there runs in the node's container, and a job is a Pod elsewhere that
  #    reads only the credential Secret, so the session flow signs in something
  #    that runs no work. With these set the control plane runs the device flow
  #    itself and delivers the credential where jobs read it.
  #
  #    These are the PROVIDER's values and none are defaulted — a wrong guess
  #    would send an operator's device code to somebody else's endpoint. Unset,
  #    the runtime simply keeps the session flow.
  #
  #    Mind the SCOPES: they decide what kind of credential comes back. A
  #    subscription login and an API-key issuance are different scope sets, and
  #    NookOS's own rule is subscription login only.
  runtimeAuth: {}
  #  claude:
  #    deviceAuthEndpoint: ""
  #    tokenEndpoint: ""
  #    clientId: ""
  #    scopes: ""
  # -- NOOK_ARTIFACT_STORE: "disk" or "s3". Exactly what this names is what is
  #    used — an S3 that cannot be reached is reported broken at boot, never
  #    quietly swapped for local disk (MAIN-598).
  artifactStore: disk
  # -- NOOK_USER_CONTENT_DIR: where uploads are written inside the control-plane
  #    pod when artifactStore is "disk". Mounted from userContent.persistence
  #    below; the image's baked /usr/local/share/nook/dist is read-only and is
  #    NOT this (MAIN-598).
  userContentDir: /var/lib/nook/user-content
  s3:
    # -- NOOK_S3_BUCKET.
    bucket: ""
    # -- NOOK_S3_ENDPOINT (unset for AWS; set for MinIO/GCS).
    endpoint: ""
    # -- NOOK_S3_REGION.
    region: ""
    # -- NOOK_S3_PATH_STYLE.
    pathStyle: true
  # ── Mail (non-secret) ──────────────────────────────────────────────────────
  # Every key here is optional and OMITTED when unset, so the control-plane
  # defaults apply (capture provider, sending off). The SMTP password and
  # Postmark token are secrets, wired via secretKeys.smtpPassword/postmarkToken.
  mail:
    # -- MAIL_PROVIDER: "capture" | "smtp" | "postmark". Empty → control-plane default (capture, delivers nothing).
    provider: ""
    # -- MAIL_FROM: the From address for outbound mail (e.g. "NookOS <no-reply@example.com>").
    from: ""
    # -- MAIL_SEND_ENABLED: the master send switch. false (default) is omitted → control-plane default (off).
    sendEnabled: false
    # -- MAIL_NOTIFICATIONS_ENABLED: also send notification emails. false (default) is omitted → off.
    notificationsEnabled: false
    # -- MAIL_MAX_PER_MONTH: cap on real sends per month. Empty → control-plane default (uncapped).
    maxPerMonth: ""
    # -- MAIL_MAX_PER_DAY: cap on real sends per day. Empty → control-plane default (uncapped).
    maxPerDay: ""
    # -- SMTP_HOST: the SMTP relay host (provider=smtp).
    smtpHost: ""
    # -- SMTP_PORT: the SMTP relay port.
    smtpPort: ""
    # -- SMTP_TLS: "none" | "starttls" | "implicit".
    smtpTls: ""
    # -- SMTP_USERNAME: the SMTP auth user (the password is secretKeys.smtpPassword).
    smtpUsername: ""
    # -- POSTMARK_API_URL: override the Postmark endpoint (the token is secretKeys.postmarkToken).
    postmarkApiUrl: ""

# ── Services ─────────────────────────────────────────────────────────────────
service:
  control:
    # -- Control-plane Service type.
    type: ClusterIP
    # -- Control-plane Service port (the API/browser port; the pod also listens on 8081 for agents — a separate issue exposes that).
    port: 8080
  web:
    # -- Web Service type.
    type: ClusterIP
    # -- Web Service port.
    port: 80

# ── Agent mTLS listener (:8081, opt-in) ──────────────────────────────────────
# Nodes join over a mutual-TLS listener whose TLS terminates INSIDE the
# control-plane process (it routes on SNI and judges each client cert against
# the right tenant CA). Any proxy in front must therefore be L4 / passthrough —
# it may route the TCP stream but must never terminate TLS. Off by default;
# turn it on to let external nodes join a cluster-hosted control plane.
agent:
  # -- Expose the agent listener. When true, agent.tlsSecret and agent.publicUrl
  #    are REQUIRED — the chart refuses to render a half-configured listener.
  enabled: false
  # -- Externally reachable address of the agent LoadBalancer, e.g.
  #    "agent.nook.example.com:8081". Baked into join tokens (NOOK_AGENT_PUBLIC_URL)
  #    so a node dials the right place. Point a DNS name at the LB's address.
  publicUrl: ""
  # -- Name of a Kubernetes TLS Secret holding the agent listener cert + key.
  #    May be a dedicated Secret or reuse existingSecret if it carries the keys
  #    below. See the README for the generate-cert + read-fingerprint path.
  tlsSecret: ""
  # -- Key inside tlsSecret holding the certificate (PEM). Default matches a
  #    `kubectl create secret tls` Secret.
  tlsCertKey: tls.crt
  # -- Key inside tlsSecret holding the private key (PEM).
  tlsKeyKey: tls.key
  service:
    # -- Agent Service type. LoadBalancer (L4 passthrough) by default; switch to
    #    NodePort or ClusterIP for other exposures (see README).
    type: LoadBalancer
    # -- Agent Service port (the LB listens here; targets the pod's 8081).
    port: 8081
    # -- Cloud LB annotations, e.g. to force an L4/NLB passthrough LB.
    annotations: {}

# ── Ingress (HTTP, fronting web) ─────────────────────────────────────────────
ingress:
  # -- Create an Ingress fronting the web Service.
  enabled: true
  # -- ingressClassName (e.g. "nginx"). "" leaves it unset (cluster default).
  className: ""
  # -- The external host that routes to this NookOS. REQUIRED for a real install.
  host: ""
  # -- The zone tunnels are served under, e.g. "tunnels.example.com". Empty
  #    leaves the deployment exactly as it was: no second rule, no wildcard TLS
  #    host, and no TUNNEL_DOMAIN, so the tunnel surface stays off. Set it and
  #    the Ingress gains a `*.<tunnelHost>` rule pointed at the CONTROL-PLANE
  #    Service (never web — see the README), and the same value reaches the
  #    control plane as TUNNEL_DOMAIN so the two cannot disagree.
  #    Store the zone itself, with no leading `*.`: a wildcard is one label
  #    deep, so this is the name `*.` is prefixed to.
  tunnelHost: ""
  # -- Extra annotations (e.g. cert-manager.io/cluster-issuer, nginx tuning).
  annotations: {}
  tls:
    # -- Terminate TLS at the Ingress.
    enabled: false
    # -- Name of a pre-existing TLS Secret. Leave "" to let cert-manager fill it via annotations.
    secretName: ""

# ── ServiceAccount ───────────────────────────────────────────────────────────
serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Name to use; empty defaults to the fullname.
  name: ""
  # -- Annotations for the ServiceAccount (e.g. cloud IAM role bindings).
  annotations: {}

# ── Uploads (MAIN-598) ───────────────────────────────────────────────────────
# A disk-backed control plane writes what people upload to config.userContentDir,
# which is mounted from here. With artifactStore="s3" the bytes go to the bucket
# and this volume is unused — leave it as an emptyDir.
userContent:
  persistence:
    # -- Back config.userContentDir with a PersistentVolumeClaim. false mounts an
    #    emptyDir instead, which is correct ONLY where uploads are disposable:
    #    the volume dies with the pod, so every attachment is lost on a restart
    #    or a rollout.
    enabled: true
    # -- Use an existing PVC by name instead of letting the chart create one.
    existingClaim: ""
    # -- Size of the chart-created PVC.
    size: 10Gi
    # -- StorageClass for the chart-created PVC. "" uses the cluster default.
    storageClass: ""
    # -- Access modes. ReadWriteOnce is right for controlPlane.replicas=1; more
    #    than one replica needs a ReadWriteMany class, or artifactStore="s3".
    #
    #    This also picks the ROLLOUT STRATEGY, and the trade is worth knowing:
    #    a ReadWriteOnce volume attaches to one node at a time, so the control
    #    plane switches to `Recreate` — the old pod stops, THEN the new one
    #    starts, which is a few seconds of downtime on every `helm upgrade`.
    #    That is deliberate. A rolling update needs both pods alive at once,
    #    which this volume cannot allow, so it deadlocks on Multi-Attach and
    #    the upgrade never completes at all (MAIN-653). ReadWriteMany, or
    #    persistence disabled, keeps the zero-downtime rolling update.
    accessModes:
      - ReadWriteOnce

# ── Pod security & scheduling (hardened defaults, all overridable) ───────────
# -- Pod-level securityContext. The images already run as uid 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
# -- Container-level securityContext. readOnlyRootFilesystem stays false — the
#    prep issue only guaranteed the process needs no writes for its OWN files;
#    turning the root fs read-only is opt-in once volumes are mapped.
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Extra pod annotations.
podAnnotations: {}
# -- Node selector for scheduling.
nodeSelector: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Affinity rules for scheduling.
affinity: {}
