apiVersion: v2
name: nook-operator-node
description: >-
  The NookOS shared operator node (MAIN-125): an in-cluster node container
  shipped with the loop toolchain (claude, hermes, codex, copilot) preinstalled,
  joined to the control plane non-interactively at first boot. Persistent volumes
  for node identity, checkouts, and the tmux runtime; join token by reference.
type: application
# Chart version — bump on chart changes. appVersion is the image tag this chart
# deploys by default, so it names the NEWEST PUBLISHED release, for the reason
# nook-control's Chart.yaml gives at length (MAIN-652).
#
# On a `v*` release these are BOTH stamped to the tag by the release workflow's
# `chart` job, exactly as nook-control's are — this chart is published beside it
# at `oci://ghcr.io/nook-os/charts/nook-operator-node` (MAIN-650). The values
# here are the dev/local default used when installing straight from a clone.
version: 0.1.0
appVersion: "0.6.13"
kubeVersion: ">=1.23.0-0"
home: https://github.com/nook-os/nook-os
sources:
  - https://github.com/nook-os/nook-os
maintainers:
  - name: NookOS
keywords:
  - nookos
  - operator-node
  - developer-platform
