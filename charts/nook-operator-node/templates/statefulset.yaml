{{- include "nook-operator-node.requireJoin" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nook-operator-node.fullname" . }}
  labels:
    {{- include "nook-operator-node.labels" . | nindent 4 }}
spec:
  # Shared substrate, not a scaled workload; parallel pods would each be a
  # distinct node. Default one.
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "nook-operator-node.fullname" . }}
  selector:
    matchLabels:
      {{- include "nook-operator-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nook-operator-node.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.executor.mode "kubernetes" }}
      serviceAccountName: {{ include "nook-operator-node.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give sessions a moment to wind down; the node itself joins once and runs.
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator-node
          image: {{ include "nook-operator-node.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: NOOK_SERVER
              value: {{ .Values.server | quote }}
            - name: NOOK_JOIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.joinToken }}
            # The FLEET's GitHub credential (MAIN-407). `optional: true` so a
            # Secret without the key still starts the pod: a node with no GitHub
            # reach is a supported state — it just cannot take review work, and
            # says so by name when asked to.
            - name: NOOK_GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.ghToken }}
                  optional: true
            - name: NOOK_NODE_NAME
              value: {{ .Values.nodeName | quote }}
            - name: NOOK_WORKSPACE_ROOT
              value: /workspace
            # This IS the shared operator node — reported as capabilities.shared_operator (AC-4).
            - name: NOOK_SHARED_OPERATOR
              value: "1"
            # The loop stages it runs, and how many at once (MAIN-142).
            - name: NOOK_LOOP_KINDS
              value: {{ join "," .Values.loopKinds | quote }}
            - name: NOOK_MAX_LOOP_JOBS
              value: {{ .Values.maxLoopJobs | quote }}
            # tmux runtime dir on its own volume (AC-2). tmux honours TMUX_TMPDIR.
            - name: TMUX_TMPDIR
              value: /var/lib/nook/tmux
            {{- if eq .Values.executor.mode "kubernetes" }}
            # Each loop job runs as a Pod of its own (MAIN-623). Absent in
            # `local` mode, so an upgrade that does not opt in is unchanged.
            - name: NOOK_EXECUTOR
              value: kubernetes
            - name: NOOK_EXECUTOR_NAMESPACE
              value: {{ .Values.executor.namespace | quote }}
            - name: NOOK_JOB_IMAGE
              value: {{ required "executor.image is required when executor.mode=kubernetes — a default here would be this chart guessing at a registry, and a wrong guess fails at ImagePullBackOff long after the install reported success" .Values.executor.image | quote }}
            {{- with .Values.executor.credentialsSecret }}
            # A hand-created Secret: read as the job Pod's environment (AC-10)
            # and mounted at CLAUDE_CONFIG_DIR, which is what carries the
            # fleet's Claude session (MAIN-669). Absent means the Pod gets no
            # credentials — never that they are written into its env, which
            # pod-read would expose.
            - name: NOOK_JOB_CREDENTIALS_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.executor.buildPool.selector .Values.executor.buildPool.taint }}
            # Both or neither — the agent refuses to start with one (MAIN-655).
            - name: NOOK_BUILD_POOL_SELECTOR
              value: {{ required "executor.buildPool.selector is required alongside .taint: a taint with no selector lets a build Pod schedule anywhere" .Values.executor.buildPool.selector | quote }}
            - name: NOOK_BUILD_POOL_TAINT
              value: {{ required "executor.buildPool.taint is required alongside .selector: a selector with no taint puts builds on a pool nothing keeps other work off" .Values.executor.buildPool.taint | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /root/.config/nook
            - name: workspace
              mountPath: /workspace
            - name: tmux
              mountPath: /var/lib/nook/tmux
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # Persistent identity, checkouts, and tmux runtime (AC-2/AC-5). volumeClaim-
  # Templates give the pod stable PVCs it re-attaches on restart; deleting them
  # (a fresh volume) makes the node re-join cleanly with a new identity.
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.config.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.config.size }}
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.workspace.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.workspace.size }}
    - metadata:
        name: tmux
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.tmux.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.tmux.size }}
