[package]
name = "nook-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nook-chat"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
nook-db = { workspace = true }
nook-auth = { workspace = true }
nook-errors = { workspace = true }
nook-types = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
# `oneshot` for the panic-layer test (MAIN-273); nook-chat otherwise needs only
# tower-http.
tower = { workspace = true }
# Test-only: every DB-backed chat test takes a private, migrated bed rather than
# the shared dev database (MAIN-165) — which is also where the control-plane
# `public` schema those tests need comes from, so nook-control is no longer a
# direct dev-dependency. No cycle — nook-testkit does not depend on nook-chat.
nook-testkit = { workspace = true }
