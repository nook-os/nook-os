[package]
name = "nook-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nook_control"
path = "src/lib.rs"

[[bin]]
name = "nook-control"
path = "src/main.rs"

[dependencies]
nook-db = { workspace = true }
nook-errors = { workspace = true }
nook-types = { workspace = true }
nook-proto = { workspace = true }
nook-dispatcher = { workspace = true }
nook-mcp = { workspace = true }
nook-auth = { workspace = true }
nook-infra = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
form_urlencoded = { workspace = true }
url = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `.nook.toml`, the repo's own settings file (MAIN-359).
toml = { workspace = true }
sqlx = { workspace = true }
# v5 (namespaced, deterministic) is used to key the per-IP preview limiter by a
# stable uuid derived from the resolved client IP.
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
openidconnect = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
# lettre / aws-config / aws-sdk-s3 / aws-credential-types moved to nook-infra
# with the mail and storage providers (MAIN-146).
aws-smithy-types = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
dotenvy = { workspace = true }
cookie = { workspace = true }
# CIDR matching for the trusted-proxy list the client-IP resolver consults.
# Pinned to the version already resolved in Cargo.lock.
ipnet = "2"

[dev-dependencies]
# Tests here build a defaulted Config via nook-infra's test-support helper,
# which moved out with the config module in MAIN-146.
nook-infra = { workspace = true, features = ["test-support"] }
# The shared test harness (MAIN-156). Cycle back to nook-control is dev-only.
nook-testkit = { workspace = true }
# The notebook seal test (MAIN-100) fabricates a client blob with
# `crypto::seal_with_passphrase` and base64-encodes it for the seal request.
base64 = { workspace = true }
# A real WebSocket client for the tunnel upgrade tests (MAIN-10). `oneshot`
# cannot reach them: the `101` is only half of an upgrade, and the half that
# matters exists only once a connection has actually been upgraded.
tokio-tungstenite = { workspace = true }

