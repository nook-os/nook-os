[package]
name = "nook-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sqlx = { workspace = true }
# The `#[derive(FromDbRow)]` half of the row mapping (MAIN-327), re-exported
# from here so callers depend on one crate.
nook-db-derive = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
# The boot-time migration runner (MAIN-224) shouts a WARN per orphan ledger row.
tracing = { workspace = true }
# The squash re-stamp (MAIN-235) refuses an unrecognised ledger with a reason.
thiserror = { workspace = true }
# flock(2) for the SQLite single-instance lock (MAIN-197). The raw syscall
# rather than a wrapper crate: it is one call, already in the dependency graph,
# and the kernel is the part doing the work.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Database LIFECYCLE — CREATE/DROP DATABASE and the bed pools (MAIN-429). Off in
# normal builds, matching nook-infra's `test-support`, so a release binary does
# not carry database-administration code at all.
test-support = []

[dev-dependencies]
tokio = { workspace = true }
