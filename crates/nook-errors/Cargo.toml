[package]
name = "nook-errors"
version.workspace = true
edition.workspace = true
license.workspace = true

# How a failure becomes an HTTP response, in one place, for both services.
#
# Named for the whole job rather than today's occupant: it starts as the panic
# safety net (MAIN-273), and MAIN-274 hoists the shared `ApiError` here to
# retire nook-chat's `ChatError`. Those two belong together — the panic net's
# whole contract is that it emits the SAME body the error mapping does, and a
# body shape agreed across two crates is a body shape that drifts.
#
# "errors", not "exceptions": Rust has `Result` and panics, not exceptions.
#
# Its own crate for
# the same reason `nook-auth` is: the control plane and nook-chat must not drift.
# A copy in each would mean two panic hooks, two thread-locals and two error
# bodies that agree only until someone edits one of them.
#
# nook-auth would have been the obvious home — both services already depend on
# it — but it is deliberately framework-free ("no AppState, no framework"), and
# this needs axum. nook-infra is shared too, but it carries S3, SMTP and Redis,
# which is not a dependency nook-chat should take on for forty lines.
[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
nook-auth = { workspace = true }
nook-db = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
