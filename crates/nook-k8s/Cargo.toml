# The Kubernetes API client an executor uses to run a loop job as a Pod
# (MAIN-339). MAIN-623 consumes it; nothing links it yet.
#
# Its own crate, and NOT a module in nook-node, because of the confinement this
# card asks for: the desktop bundle ships the `nook` binary, so folding
# `k8s-openapi` into nook-node would put a Kubernetes API surface into every
# laptop install of an app that has no cluster. A crate keeps the dependency
# where one `[dependencies]` line makes it opt-in — the line MAIN-623 adds when
# it grows the Pod driver that needs it.
[package]
name = "nook-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nook_k8s"
path = "src/lib.rs"

[dependencies]
# `client` pulls `config` with it. rustls with ring, matching the rest of the
# tree — this repo has no OpenSSL anywhere and must not gain one here.
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring"] }
# The Kubernetes version whose generated types we compile against. Exactly one
# `v1_*` feature may be enabled, and `Pod` is unchanged across the supported
# range, so this pins the generated bindings rather than the clusters we talk to.
k8s-openapi = { version = "0.28", features = ["v1_34"] }
http = "1"
futures-util = { workspace = true }
# The in-cluster CA arrives as PEM and `kube::Config` wants DER. Already the
# tree's PEM reader (the node's certificate handling uses it).
rustls-pemfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The API surface is asserted against `tower_test::mock` — the same harness
# kube's own suite uses — so every request shape is checked without a cluster.
tower-test = "0.4"
# Draining a request body to assert what was actually sent.
http-body-util = "0.1"
serde_json = { workspace = true }
tokio = { workspace = true }
