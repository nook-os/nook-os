[package]
name = "nook-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nook"
path = "src/main.rs"

[dependencies]
nook-types = { workspace = true }
nook-proto = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
webpki-roots = "0.26"
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
portable-pty = { workspace = true }
sysinfo = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# The generated Traefik tunnel rule is a regular expression, and the assertion
# that it cannot match the apex is only worth anything if a regex engine makes
# it (MAIN-511 AC-4/AC-8). Traefik v3 uses Go's RE2; this pattern means the
# same in both.
regex = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

