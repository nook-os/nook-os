[package]
name = "nook-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nook"
path = "src/main.rs"

[dependencies]
nook-types = { workspace = true }
# The policy a desktop install's shell supervises its sidecars with — `main`
# installs the exit-with-parent watchdog from it, so a force-quit of the app
# does not leave this node running against a control plane that is gone
# (MAIN-400).
nook-desktop-env = { workspace = true }
nook-proto = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
webpki-roots = "0.26"
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
portable-pty = { workspace = true }
sysinfo = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
# `nook tenants export` reads the manifest back out of the archive it just
# wrote, which is also what proves the file it produced is a readable one
# (MAIN-659).
tar = { workspace = true }
flate2 = { workspace = true }

# OPTIONAL, and that is the whole point (MAIN-623). The desktop bundle builds
# this crate's `nook` binary, so a plain dependency here would ship k8s-openapi
# to every laptop install of an app with no cluster -- the trade nook-k8s's
# guard exists to make somebody look at. Behind a feature, the default build is
# byte-for-byte what it was, and a cluster image opts in with
# `--features kubernetes`.
nook-k8s = { workspace = true, optional = true }

[features]
default = []
# The Pod executor: run loop jobs as Kubernetes Pods instead of local processes.
kubernetes = ["dep:nook-k8s"]

[dev-dependencies]
# The generated Traefik tunnel rule is a regular expression, and the assertion
# that it cannot match the apex is only worth anything if a regex engine makes
# it (MAIN-511 AC-4/AC-8). Traefik v3 uses Go's RE2; this pattern means the
# same in both.
regex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

