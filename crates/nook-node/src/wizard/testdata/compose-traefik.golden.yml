# NookOS control plane — generated by `nook server init`.
#
# Image tags are pinned. `latest` would make an unrelated `docker compose
# up` a surprise upgrade, and a rollback an archaeology exercise.

networks:
  traefik_default:
    external: true
  internal:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nook
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook"]
      interval: 5s
      timeout: 5s
      retries: 30

  control-plane:
    image: ghcr.io/nook-os/nook-control:v9.9.9
    restart: unless-stopped
    env_file: .env
    volumes:
      # The agent listener's certificate. Nodes pin its fingerprint.
      - ./agent-certs:/etc/nook:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    networks:
      internal:
      traefik_default:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.nook-api.rule=Host(`nook.example.com`) && (PathPrefix(`/api`) || PathPrefix(`/mcp`) || PathPrefix(`/healthz`) || PathPrefix(`/.well-known`) || Path(`/install.sh`))"
      - "traefik.http.routers.nook-api.entrypoints=websecure"
      - "traefik.http.routers.nook-api.tls=true"
      - "traefik.http.routers.nook-api.priority=20"
      - "traefik.http.services.nook-api.loadbalancer.server.port=8080"
      # Nodes, by SNI, in PASSTHROUGH mode. This is load-bearing: the
      # control plane must see the client certificate itself, so the proxy
      # may route this stream but must never open it. Terminating here
      # breaks mutual TLS and the fingerprint pin in one go.
      - "traefik.tcp.routers.nook-agent.rule=HostSNI(`agent.nook.example.com`)"
      - "traefik.tcp.routers.nook-agent.entrypoints=websecure"
      - "traefik.tcp.routers.nook-agent.tls.passthrough=true"
      - "traefik.tcp.services.nook-agent.loadbalancer.server.port=8081"

  web:
    image: ghcr.io/nook-os/nook-web:v9.9.9
    restart: unless-stopped
    environment:
      CONTROL_PLANE_ORIGIN: http://control-plane:8080
    depends_on: [control-plane]
    expose: ["80"]
    networks:
      internal:
      traefik_default:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.nook-web.rule=Host(`nook.example.com`)"
      - "traefik.http.routers.nook-web.entrypoints=websecure"
      - "traefik.http.routers.nook-web.tls=true"
      - "traefik.http.routers.nook-web.priority=10"
      - "traefik.http.services.nook-web.loadbalancer.server.port=80"

volumes:
  pgdata:
