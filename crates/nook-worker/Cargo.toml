[package]
name = "nook-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nook_worker"
path = "src/lib.rs"

[[bin]]
name = "nook-worker"
path = "src/main.rs"

# Deliberately thin: this links `nook-infra` (config + the queue) and nothing
# from the control plane's HTTP/WS/UI surface, so a fleet of workers scales
# cheaply (MAIN-148 AC-1).
[dependencies]
nook-db = { workspace = true }
nook-infra = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
# The tests build the queue schema from the control plane's migration set
# (owned there, MAIN-146 NG-2) and enqueue work with a tenant uuid. Cargo allows
# this dev-only dependency cycle (nook-control depends on nook-infra, not on the
# worker), and the test-support feature exposes `Config::for_test()`.
nook-control = { workspace = true }
nook-infra = { workspace = true, features = ["test-support"] }
nook-testkit = { workspace = true }
uuid = { workspace = true }
