# NookOS dev stack — Docker FIRST. One command brings up everything; source
# is bind-mounted and rebuilt by cargo watch / Vite INSIDE the containers.
# `docker compose down -v` destroys everything; `./run.sh` recreates it.
services:
  postgres:
    image: postgres:16-alpine
    # Docker's default /dev/shm is 64 MB. Postgres puts parallel-query and
    # parallel-worker segments there, and the test suite runs many private
    # databases at once — on 2026-07-30 that combination exhausted it and
    # crashed the server ("could not resize shared memory segment"), which then
    # took three minutes to recover. MAIN-243 removed the accumulation that made
    # it likely; this removes the cliff itself, cheaply.
    shm_size: 512mb
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    ports:
      - "${NOOK_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage for node binaries, so the S3 backend is exercised locally
  # exactly as it is in production. Credentials are dev-only by design.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nookdev
      MINIO_ROOT_PASSWORD: nookdevsecret
    ports:
      - "${NOOK_MINIO_PORT:-9000}:9000"
      - "${NOOK_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: make the bucket the control plane expects. Idempotent, so it is
  # safe on every `up`.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 nookdev nookdevsecret &&
             mc mb --ignore-existing local/nook-artifacts &&
             echo 'bucket ready'"

  # Redis — the reserved queue/cache backend (MAIN-150). Not the default; the
  # control plane and worker stay on `database` unless NOOK_QUEUE_PROVIDER=redis
  # is set. Present so the redis provider can be exercised locally and in tests.
  redis:
    image: redis:7-alpine
    ports:
      - "${NOOK_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ElasticMQ — an in-memory, SQS-compatible server for the sqs queue provider's
  # contract tests (MAIN-152). Point NOOK_TEST_SQS_ENDPOINT / NOOK_SQS_ENDPOINT_URL
  # at http://localhost:9324. No live-AWS dependency in tests (AC-2).
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "${NOOK_SQS_PORT:-9324}:9324"

  # Mailpit — a live dev inbox. Outbound mail (email verification, invites) is
  # sent over SMTP to :1025 and read in the web UI at http://localhost:8025.
  # Ephemeral by design (NG-4): the inbox is not persisted across `down`.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${NOOK_SMTP_PORT:-1025}:1025" # SMTP — the control plane sends here (mailpit:1025 on the net)
      - "${NOOK_MAILPIT_PORT:-8025}:8025" # Web UI — open http://localhost:8025 to read dev mail

  control-plane:
    # On BOTH networks: the default one it shares with postgres/web/node, and
    # the `operator` one, which is the operator node's only way out (MAIN-141).
    networks:
      - default
      - operator
    build:
      context: .
      dockerfile: deploy/docker/dev-rust.Dockerfile
    command: cargo watch --poll -w crates -w Cargo.toml -w Cargo.lock -x 'run -p nook-control'
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgres://nook:nook@postgres:5432/nook
      CONTROL_PLANE_BIND: 0.0.0.0:8080
      # The node agent's own door (see Config::agent_bind). Separate from the
      # browser API so mTLS can terminate here rather than at the edge proxy.
      NOOK_AGENT_BIND: 0.0.0.0:8081
      # Deep links DEFAULT to the leased web port, and stay overridable
      # (MAIN-376, owner ruling). `env_file` is literal — compose does not
      # interpolate inside it — so the substitution has to happen here; but a
      # bare `http://localhost:${NOOK_WEB_PORT:-5173}` made these win
      # unconditionally and turned a real knob into a dead one. That broke
      # reaching the stack by hostname or over the LAN, which is what OIDC dev
      # actually needs, and it broke it HALF-WAY: these two snapped back to
      # localhost while OIDC_REDIRECT_URL kept the hostname.
      #
      # The nested form keeps all three cases true at once: unset gives 5173,
      # a lease moves it, and an explicit value still wins.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${NOOK_WEB_PORT:-5173}}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${NOOK_WEB_PORT:-5173}}
      # mTLS terminates at the control plane, not the proxy — only it knows
      # which tenant CA to judge a client certificate against. Dev cert is
      # self-signed; nodes pin it by fingerprint.
      NOOK_AGENT_TLS_CERT: /app/deploy/dev-certs/agent.crt
      NOOK_AGENT_TLS_KEY: /app/deploy/dev-certs/agent.key
      CARGO_TARGET_DIR: /app/target-docker
      # Node binaries the "add node" modal offers. In production the control
      # image ships the build it was compiled with; in dev, populate it with
      #   cargo build --release -p nook-node \
      #     && cp target/release/nook dist/nook-linux-$(uname -m)
      NOOK_DIST_DIR: /app/dist
      # The FLEET's GitHub token (MAIN-407), read here so the control plane can
      # size each repo's review loops to its open PRs (MAIN-448). Never a
      # literal — only the variable, so a real credential lives in .env. Empty
      # is the honest default: review loops then run at their declared ceiling,
      # exactly as they did before the forge landed.
      NOOK_GH_TOKEN: ${NOOK_GH_TOKEN:-}
      # Artifact storage. Dev points at the local MinIO so the S3 path is the
      # one being exercised day to day — a backend only tested in production
      # is a backend nobody has tested.
      NOOK_ARTIFACT_STORE: ${NOOK_ARTIFACT_STORE:-s3}
      NOOK_ARTIFACT_PREFIX: nook
      NOOK_S3_BUCKET: nook-artifacts
      NOOK_S3_ENDPOINT: http://minio:9000
      NOOK_S3_REGION: us-east-1
      NOOK_S3_ACCESS_KEY_ID: nookdev
      NOOK_S3_SECRET_ACCESS_KEY: nookdevsecret
      NOOK_S3_PATH_STYLE: "true"
      # Hand out presigned URLs instead of streaming. Off by default so one
      # hostname serves everything; flip to test the redirect path.
      NOOK_ARTIFACT_REDIRECT: ${NOOK_ARTIFACT_REDIRECT:-false}
      # Send outbound mail to Mailpit (above) instead of the capture provider,
      # so verification/invite emails render into a real inbox at :8025. Dev
      # only — the shipped default is MAIL_PROVIDER unset → capture (nothing is
      # delivered), so this never makes another environment send mail.
      MAIL_PROVIDER: smtp
      # The transport alone is not enough: the send guard (MAIL_SEND_ENABLED,
      # default OFF) captures everything regardless of provider, so without this
      # invite/verification mail never actually left for Mailpit. Enable it here,
      # dev only — prod keeps the default-off guard (NG-5).
      MAIL_SEND_ENABLED: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: "NookOS dev <no-reply@nook.local>"
    ports:
      - "${NOOK_CONTROL_PORT:-8080}:8080"
      - "${NOOK_AGENT_PORT:-8081}:8081"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target-docker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 300s

  # Team chat — its own service/container (MAIN-48). Shares the Postgres but
  # owns its tables in the `chat` schema, and validates NookOS sessions via the
  # shared nook-auth crate. cargo-watch rebuilds it on save, like control-plane.
  chat:
    build:
      context: .
      dockerfile: deploy/docker/dev-rust.Dockerfile
    command: cargo watch --poll -w crates -w Cargo.toml -w Cargo.lock -x 'run -p nook-chat'
    working_dir: /app
    environment:
      DATABASE_URL: postgres://nook:nook@postgres:5432/nook
      CHAT_BIND: 0.0.0.0:8082
      CARGO_TARGET_DIR: /app/target-docker
    ports:
      - "${NOOK_CHAT_PORT:-8082}:8082"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target-docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 300s

  # The queue worker (MAIN-148): a long-running background process that drains
  # the durable queue and runs a handler per work_type. No HTTP surface, so no
  # port and no healthcheck — cargo-watch rebuilds it on save like the others,
  # and it shares the control plane's cargo target so it stays warm.
  worker:
    build:
      context: .
      dockerfile: deploy/docker/dev-rust.Dockerfile
    command: cargo watch --poll -w crates -w Cargo.toml -w Cargo.lock -x 'run -p nook-worker'
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgres://nook:nook@postgres:5432/nook
      # The zero-infra provider; the same env name the control plane reads.
      NOOK_QUEUE_PROVIDER: ${NOOK_QUEUE_PROVIDER:-database}
      # Unset = every registered handler's type (`noop` + `email.send`). Set a
      # comma-separated allow-list to scope one worker to certain work types.
      NOOK_WORK_TYPES: ${NOOK_WORK_TYPES:-}
      # Mail: the worker now delivers email jobs, so it needs the same transport
      # config the control plane has — dev sends to Mailpit (MAIN-149 AC-2). The
      # send guard is on here (dev only) so invite/verification mail reaches the
      # inbox; prod keeps the shipped default-off guard.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_SEND_ENABLED: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: "NookOS dev <no-reply@nook.local>"
      CARGO_TARGET_DIR: /app/target-docker
      RUST_LOG: ${RUST_LOG:-nook_worker=info,info}
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target-docker
    depends_on:
      postgres:
        condition: service_healthy

  node:
    build:
      context: .
      dockerfile: deploy/docker/dev-rust.Dockerfile
    entrypoint: ["bash", "deploy/docker/node-dev-entrypoint.sh"]
    # tini as PID 1 reaps reparented zombies. tmux's `new-session -d` double-forks
    # a server daemon that reparents to PID 1; the node is a plain binary and never
    # wait()s on orphans it did not spawn, so without an init they pile up as
    # <defunct>. The node's OWN pty children are reaped in sessions.rs; this is
    # only for the daemons tmux orphans onto PID 1.
    init: true
    working_dir: /app
    environment:
      NOOK_SERVER: http://control-plane:8080
      NOOK_DEV_JOIN_TOKEN: ${NOOK_DEV_JOIN_TOKEN:-}
      NOOK_NODE_NAME: dev-node
      # Ports this node leases to sessions (MAIN-301) — a different band from
      # the operator's, so the two dev nodes never advertise the same numbers.
      NOOK_PORT_RANGE: 4200-4299
      # The dev control plane is plain http:// on the container network, so the
      # node would (correctly) refuse to talk to it. This is the one case the
      # insecure hatch exists for; it is refused outright when APP_ENV=production.
      NOOK_INSECURE: "1"
      CARGO_TARGET_DIR: /app/target-docker-node
      # The fleet's Claude identity (MAIN-238). `claude` 2.1.220 honours
      # CLAUDE_CONFIG_DIR — verified: setting it makes the CLI read and write
      # its `.claude.json` there — so the mount below IS the session store, and
      # the host's ~/.claude is never touched. An empty/absent dir just means
      # unauthenticated: the runtime probe reports `claude` NotAuthorized and
      # the stack boots exactly as it does today.
      CLAUDE_CONFIG_DIR: /nook-claude
      RUST_LOG: nook=info
    volumes:
      # Device-auth session files, gitignored on the host. Deliberately a
      # SEPARATE identity from the operator's own login, so swapping the
      # fleet's account is `rm -rf .nook-secrets/claude` + `./run.sh
      # --claude-login`, with no risk to a personal session.
      - ./.nook-secrets/claude:/nook-claude
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target-node:/app/target-docker-node
      - demo-workspaces:/workspace
      - node-config:/root/.config/nook
    depends_on:
      control-plane:
        condition: service_healthy

  # The shared operator node (MAIN-125) — a FIRST-CLASS member of the dev stack
  # (MAIN-140): plain `docker compose up` / `./run.sh` builds and boots it with
  # everything else, because the loop features landing on it (cached clones,
  # spec-from-operator, the jobs queue) can only be exercised with it present.
  # The FIRST build is slow — the image installs the pinned agent runtimes
  # (claude/hermes/codex/copilot) — but later builds ride the Docker layer cache.
  # Don't want the container? `docker compose up -d --scale operator-node=0`.
  # It joins the dev control plane exactly as a real operator node joins prod
  # (via NOOK_DEV_JOIN_TOKEN, seeded by the control plane from .env); identity,
  # checkouts, and tmux live on named volumes so a restart re-attaches (AC-5).
  operator-node:
    # ONLY the `operator` network (MAIN-141): the agent workloads this node runs
    # can reach the control plane and the public internet, and cannot resolve —
    # let alone reach — postgres, mailpit, web, or the plain node. That is the
    # dev mirror of the chart's NetworkPolicy.
    #
    # ACCEPTED DEV-ONLY GAP: Docker still NATs this network to the host, so the
    # host LAN remains reachable from inside the container. Closing that would
    # need iptables in the container (NG-3); Kubernetes is the enforced surface,
    # and the chart's policy subtracts every private range there.
    networks:
      - operator
    build:
      context: .
      dockerfile: deploy/docker/operator-node.Dockerfile
    # tini as PID 1 — reaps the tmux server daemons that reparent to PID 1 (see
    # the `node` service). Same reason, same one-line fix.
    init: true
    environment:
      NOOK_SERVER: http://control-plane:8080
      NOOK_JOIN_TOKEN: ${NOOK_DEV_JOIN_TOKEN:-}
      NOOK_NODE_NAME: dev-operator
      NOOK_WORKSPACE_ROOT: /workspace
      # Plain http:// on the container network — same dev-only hatch the node
      # service uses; refused outright when APP_ENV=production.
      NOOK_INSECURE: "1"
      NOOK_SHARED_OPERATOR: "1"
      # The loop stages this node runs (MAIN-142). No `build`: shared substrate
      # never runs the build loop, and the control plane enforces that wall
      # regardless of what is listed here.
      NOOK_LOOP_KINDS: spec,decompose,review,epic-run
      NOOK_MAX_LOOP_JOBS: "2"
      # The FLEET's GitHub token (MAIN-407) — never a literal here, only the
      # variable, so a real credential lives in .env and nothing committed can
      # carry one. Empty is the honest default: a review job then refuses by
      # name instead of reading every PR as "nothing to review".
      NOOK_GH_TOKEN: ${NOOK_GH_TOKEN:-}
      # The ports this node leases to sessions (MAIN-301). A session gets one
      # per listener its WORKSPACE declared, each as the env var that workspace
      # named, so two worktrees of the same app run side by side instead of
      # fighting over a hardcoded 3000. Unset would mean "lease nothing" —
      # deliberately, since a guessed range would hand out ports something else
      # on the machine is already listening on.
      NOOK_PORT_RANGE: 4100-4199
      # The operator node boots with the dev stack by default (MAIN-140), but it
      # only claims loop work when the loops master switch is ON — which it is
      # NOT by default (MAIN-239). So a fresh stack has an operator standing by
      # and doing nothing, on purpose. Turn loops on with
      # `nook operator loops on` or Settings → Loops.
      # Put the tmux runtime (its socket dir) on a named volume — tmux honours
      # TMUX_TMPDIR, and nook shells out to tmux inheriting this env.
      TMUX_TMPDIR: /var/lib/nook/tmux
      # The fleet's Claude identity (MAIN-238). `claude` 2.1.220 honours
      # CLAUDE_CONFIG_DIR — verified: setting it makes the CLI read and write
      # its `.claude.json` there — so the mount below IS the session store, and
      # the host's ~/.claude is never touched. An empty/absent dir just means
      # unauthenticated: the runtime probe reports `claude` NotAuthorized and
      # the stack boots exactly as it does today.
      CLAUDE_CONFIG_DIR: /nook-claude
      RUST_LOG: nook=info
    volumes:
      # Device-auth session files, gitignored on the host. Deliberately a
      # SEPARATE identity from the operator's own login, so swapping the
      # fleet's account is `rm -rf .nook-secrets/claude` + `./run.sh
      # --claude-login`, with no risk to a personal session.
      - ./.nook-secrets/claude:/nook-claude
      # Node identity + generated SSH key: a restart re-attaches as the SAME
      # node instead of re-joining as a new one (AC-5).
      - operator-config:/root/.config/nook
      # Cloned repos / worktrees: a restart keeps the checkouts (AC-5).
      - operator-workspaces:/workspace
      # tmux runtime dir (AC-2/AC-5). The socket file persists; note a container
      # stop still terminates the tmux server process itself.
      - operator-tmux:/var/lib/nook/tmux
    depends_on:
      control-plane:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "corepack enable && pnpm install && pnpm --filter @nookos/web dev"
    environment:
      NOOK_API_PROXY: http://control-plane:8080
      NOOK_CHAT_PROXY: http://chat:8082
      # The browser arrives on the LEASED host port; Vite still binds 5173
      # inside the container, because that is the container side of the mapping
      # above. Without this the forwarded-host header names the bind port and
      # `nook join` commands point at whichever checkout owns 5173 (MAIN-376).
      NOOK_WEB_PUBLIC_PORT: ${NOOK_WEB_PORT:-5173}
    ports:
      - "${NOOK_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - web-node-modules:/app/frontend/node_modules
    depends_on:
      control-plane:
        condition: service_healthy

# One extra network beside the implicit default (MAIN-141). Every other service
# stays on the default, so only the two services below can see each other here.
networks:
  default:
  operator:

volumes:
  pgdata:
  miniodata:
  cargo-registry:
  cargo-target:
  cargo-target-node:
  demo-workspaces:
  node-config:
  operator-config:
  operator-workspaces:
  operator-tmux:
  web-node-modules:
