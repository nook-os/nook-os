# Kept OUT of the main Cargo workspace on purpose: the Tauri toolchain pulls
# heavy desktop dependencies that would slow every backend build.
[package]
name = "nookos-desktop"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# Links go to the OS browser. Without this the only way to follow one was to
# navigate the app's single webview, which lands it on an origin where every
# command below is denied by ACL.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The device flow runs HERE rather than in the webview. A browser request from
# `tauri://localhost` to the identity provider would need CORS on the provider;
# a request from Rust needs nothing from anyone.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-shell = "2.3.5"
# The bundled control plane's boot environment. It lives in the cargo workspace
# so `nook-control`'s own suite can start the real binary with it — a map that
# only this crate could see is how MAIN-396 shipped one that never booted
# (MAIN-434). The crate itself is three dependencies deep, so it costs the
# desktop build nothing.
nook-desktop-env = { path = "../../../../crates/nook-desktop-env" }

[lib]
name = "nookos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
